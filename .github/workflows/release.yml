# npm への公開。GitHub 上から手動で実行する（自動では公開しない）。
# 事前に `pnpm changeset version` で版を上げた変更を main に入れておくこと。
# 認証は npm の Trusted Publishing（OIDC）を使う。初回はパッケージが npm になく Trusted Publishing を設定できないため、
# 初回の認証設定は docs/release.md の手順に従う（REQ-141）
name: release

on:
  workflow_dispatch:

# 書き込みの権限は publish のジョブだけに持たせる。依存パッケージのスクリプトやビルドが動く check のジョブには渡さない（REQ-143）
permissions:
  contents: read

# 公開を重ねて走らせない。実行中のものは取り消さず、終わるまで待つ（REQ-140）
concurrency:
  group: release
  cancel-in-progress: false

# action はコミットの SHA で固定する。コメントは固定したときの版（REQ-143）
jobs:
  check:
    # main 以外のブランチからは公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # pnpm test の changeset status は main からの差分を見るため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # pnpm changeset version で消化していない changeset が残っていれば止める（版を上げずに公開しないため）
      - name: 未消化の changeset がないことを確かめる
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "未消化の changeset があります。先に pnpm changeset version を実行して main に入れてください:"
            echo "$pending"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # 品質コマンドが通らない状態では公開しない（REQ-140）
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
      # publish のジョブはビルドしないので、ビルドの結果を渡す
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が要る。Node に同梱の npm は版が変わるので固定する
      - run: npm install -g npm@11.19.0
      # このジョブは OIDC のトークンを取れるので、依存パッケージのスクリプトを動かさない
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: packages
      - name: ビルドの結果がそろっていることを確かめる
        run: |
          for f in core/dist/index.js kit/dist/index.js trace/dist/index.js runner/dist/index.js cli/dist/cli.js; do
            test -f "packages/$f" || { echo "packages/$f がありません"; exit 1; }
          done
      # NPM_TOKEN がなければ、npm は OIDC で認証する。provenance は、公開リポジトリから OIDC で公開したときに npm が付ける
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - run: |
          gh auth setup-git
          git push --follow-tags
        env:
          GH_TOKEN: ${{ github.token }}
