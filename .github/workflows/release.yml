# npm への公開。GitHub 上から手動で実行する（自動では公開しない）。
# 事前に `pnpm changeset version` で版を上げた変更を main に入れておくこと。
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # main 以外のブランチからは公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git rev-parse --verify main || git branch main origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # pnpm changeset version で消化していない changeset が残っていれば止める（版を上げずに公開しないため）
      - name: 未消化の changeset がないことを確かめる
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "未消化の changeset があります。先に pnpm changeset version を実行して main に入れてください:"
            echo "$pending"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - run: |
          gh auth setup-git
          git push --follow-tags
        env:
          GH_TOKEN: ${{ github.token }}
