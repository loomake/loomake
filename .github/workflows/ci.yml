name: ci

on:
  # PR にラベルを付けたときにも起動する（REQ-273）。既定の種類（opened・synchronize・reopened）は残す
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # 毎日 1 回、main を 3 つの OS で確かめる（REQ-049）。18:00 UTC は日本時間の 3:00
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

# 同じ PR に新しい push があれば、古い実行を取り消す。main への push の実行は取り消さない（docs/dev/ci.md）
# main への push は実行ごとに group を分ける。group が同じだと、待機中の実行が次の push の実行に置き換えられて取り消される
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 品質コマンドを実行する。PR では ubuntu だけで、main への push・定期実行と、専用のラベルが付いた PR では 3 つの OS で実行する（REQ-049・REQ-273）。
  # macOS と Windows ではテストを 2 つのシャードに分ける（REQ-214）。文書だけの PR では飛ばす（REQ-270）
  # OS が ubuntu だけのときは、シャードの組み合わせがすべて exclude で除かれ、include の ubuntu だけが残る
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:all-os') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        shard: ['1/2', '2/2']
        exclude:
          - os: ubuntu-latest
        include:
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      # changeset status は main からの差分を見るため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
        shell: bash
      # 文書だけの PR では、ここから下のステップを飛ばす（REQ-270）。必須チェックのジョブが同じ名前で結果を報告するよう、
      # paths フィルタではなくジョブの中で判定する。PR でないとき・判定できないときは docs_only=false になり、すべて実行する
      - id: changes
        run: node scripts/ci-docs-only.mjs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
      # 外部 Action の参照は、固定の検査（REQ-167）が読めるよう、ステップの先頭の「- uses:」に置く
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck
      # macOS と Windows のシャードでは、隔離一覧（tests/quarantine.json）でその OS に指定したファイルを除く。
      # 一覧の誤りや期限切れはこのステップで失敗する。ubuntu は一覧を読まない（REQ-214・REQ-344。手順は docs/dev/ci.md）
      - if: matrix.shard && steps.changes.outputs.docs_only != 'true'
        id: quarantine
        run: node scripts/ci-quarantine.mjs --os "$CI_TEST_OS"
        shell: bash
        env:
          CI_TEST_OS: ${{ matrix.os }}
      # macOS と Windows のシャードでは、実行環境が止まった区間を見つけるため、テストの前に心拍の記録を裏で起動する（REQ-345）。
      # 起動・記録の失敗でジョブの成否は変わらない
      - if: matrix.shard && steps.changes.outputs.docs_only != 'true'
        id: heartbeat
        run: node scripts/ci-heartbeat.mjs start "$RUNNER_TEMP/loomake-ci-heartbeat"
        shell: bash
      # 2 つのシャードと quality-quarantine ワークフローを合わせて、すべてのテストを実行する。除くファイルは vitest.config.ts が受け取る
      - if: matrix.shard && steps.changes.outputs.docs_only != 'true'
        run: pnpm test --shard=${{ matrix.shard }}
        id: test_shard
        env:
          LOOMAKE_TEST_QUARANTINE_EXCLUDE: ${{ steps.quarantine.outputs.exclude }}
          LOOMAKE_CI_HEARTBEAT_DIR: ${{ runner.temp }}/loomake-ci-heartbeat
      # ubuntu ではすべてのテストを 1 回だけ、カバレッジ付きで実行する。カバレッジは閾値（vitest.config.ts）を下回ったら失敗する。1 つの OS で測れば足りる
      - if: ${{ !matrix.shard && steps.changes.outputs.docs_only != 'true' }}
        run: pnpm test --coverage
        id: test_all
      # テスト失敗後も診断を保存する。生成が失敗しても、別ステップの upload は試みる（REQ-289〜291）
      - id: diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.changes.outputs.docs_only != 'true' }}
        run: node scripts/ci-test-diagnostics.mjs
        env:
          CI_TEST_OS: ${{ matrix.os }}
          CI_TEST_SHARD: ${{ matrix.shard || 'all' }}
          CI_TEST_OUTCOME: ${{ matrix.shard && steps.test_shard.outcome || steps.test_all.outcome }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: diagnostics_upload
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' && steps.changes.outputs.docs_only != 'true' }}
        with:
          name: ci-tests-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.shard == '1/2' && '1-2' || matrix.shard == '2/2' && '2-2' || 'all' }}
          path: |
            ${{ runner.temp }}/loomake-ci-test-diagnostics/metadata.json
            ${{ runner.temp }}/loomake-ci-test-diagnostics/summary.md
            ${{ runner.temp }}/loomake-ci-test-diagnostics/test-report.json
          retention-days: 7
          if-no-files-found: warn
      # テストの成否によらず心拍を止めて要約を出し、試験の段階の記録と合わせて 7 日保存する（REQ-345）
      - id: heartbeat_stop
        if: ${{ !cancelled() && matrix.shard && steps.changes.outputs.docs_only != 'true' }}
        run: node scripts/ci-heartbeat.mjs stop "$RUNNER_TEMP/loomake-ci-heartbeat"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: heartbeat_upload
        if: ${{ !cancelled() && matrix.shard && steps.changes.outputs.docs_only != 'true' }}
        with:
          name: ci-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.shard == '1/2' && '1-2' || '2-2' }}
          path: ${{ runner.temp }}/loomake-ci-heartbeat/
          retention-days: 7
          if-no-files-found: warn
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build
      - if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package" --skip-build
        shell: bash
      - if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash

  # 過去の下限Node20での追加確認。配布物の宣言する下限は下のnode22で検証する。
  # 開発用ツールの動作環境に左右されないよう、インストールとビルドは開発と同じ Node 24 で行う
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package" --skip-build
        shell: bash
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-offline" --skip-build
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
      - run: node --version
      # 引数なしの CLI は使い方を表示して終了コード 2 を返す
      - run: code=0; node packages/cli/dist/cli.js || code=$?; test $code -eq 2
      # archive のあとも動くよう、検査用プロジェクトの change で動かす
      - run: node ../../../packages/cli/dist/cli.js verify --change sample --spec-only
        working-directory: tests/fixtures/verify-project
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: python3 scripts/deny-network.py node scripts/runtime-compatibility.mjs "$RUNNER_TEMP/loomake-offline" "$RUNNER_TEMP/loomake-runtime-results" 20.19.0
        shell: bash

  # 配布物で宣言する下限Node。Node20の追加試験とは分ける。
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package" --skip-build
        shell: bash
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-offline" --skip-build
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - run: node --version
      # 引数なしの CLI は使い方を表示して終了コード 2 を返す
      - run: code=0; node packages/cli/dist/cli.js || code=$?; test $code -eq 2
      # archive のあとも動くよう、検査用プロジェクトの change で動かす
      - run: node ../../../packages/cli/dist/cli.js verify --change sample --spec-only
        working-directory: tests/fixtures/verify-project
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: python3 scripts/deny-network.py node scripts/runtime-compatibility.mjs "$RUNNER_TEMP/loomake-offline" "$RUNNER_TEMP/loomake-runtime-results" 22.12.0
        shell: bash

  # PR ごとの完了ゲート（REQ-010, REQ-054, REQ-132）。先に PR の段階を変えたファイルと spec の差分から決め（REQ-342）、段階ごとに検査を変える（REQ-343）。
  # L1（文書だけ）は lint と文書のリンクの試験だけで verify を呼ばない。L2 は PR 本文・変えたファイル・ブランチ名から決めた change を --done で検査し、
  # L3 は change を必須にする。段階と理由はステップの出力 tier・tier_line に入る。段階の決め方は docs/dev/ci.md
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ci-gate が gh で PR 本文を読む
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # verify --done が実行する pnpm test の changeset status のため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # validate の結果が OpenSpec の更新で変わらないよう、版を固定する
      - run: npm install -g @fission-ai/openspec@1.14.3
      # archive で反映したあとの仕様は、change ごとの完了ゲートでは検査されない（REQ-010）
      - run: openspec validate --specs --strict
      - run: pnpm build
      - id: gate
        run: node scripts/ci-gate.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  # Scenario 監査（REQ-188〜190）を警告として流す。quality の ubuntu が保存した全体試験のレポートを使い、試験を再実行しない。
  # exit 0 が続くまでは監査のステップを continue-on-error にし、ジョブを失敗させない。必須チェックにも入れない。
  # quality の各ステップの条件は REQ-214・REQ-291 の試験が固定しているため、別のジョブに置く。文書だけの PR ではレポートがなく、ダウンロード以降を飛ばす
  scenario-audit:
    needs: quality
    # macOS・Windows の脚が失敗しても、ubuntu のレポートがあれば監査する
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: report
        continue-on-error: true
        with:
          name: ci-tests-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-all
          path: ${{ runner.temp }}/loomake-ci-tests
      - if: steps.report.outcome == 'failure'
        run: echo "::warning::全体試験のレポート（quality の ubuntu の artifact）を取得できなかったため、Scenario 監査を飛ばしました"
        shell: bash
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.report.outcome == 'success'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.report.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.report.outcome == 'success'
        run: pnpm install --frozen-lockfile
      # 監査は packages/kit/dist を読む
      - if: steps.report.outcome == 'success'
        run: pnpm build
      - id: audit
        if: steps.report.outcome == 'success'
        continue-on-error: true
        run: node scripts/scenario-audit.mjs "$RUNNER_TEMP/loomake-scenario-audit" docs/quality/scenarios.json "$RUNNER_TEMP/loomake-ci-tests/test-report.json"
        shell: bash
      - if: steps.audit.outcome == 'failure'
        run: echo "::warning::Scenario 監査が終了コード 0 以外で終わりました。artifact の audit.md を確かめてください"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        with:
          name: scenario-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loomake-scenario-audit/audit.json
            ${{ runner.temp }}/loomake-scenario-audit/audit.md
          retention-days: 7
          if-no-files-found: warn
