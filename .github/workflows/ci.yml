name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 3 つの OS で品質コマンドを実行する（REQ-049）
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # changeset status は main からの差分を見るため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
        shell: bash
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # カバレッジは閾値（vitest.config.ts）を下回ったら失敗する。1 つの OS で測れば足りる
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash

  # 実行時の下限（engines.node >=20.19.0、REQ-048）で、ビルドした CLI が動くかを確かめる。
  # vitest・eslint・changesets は Node 22 以上を求めるので、インストールとビルドは Node 24 で行う
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
      - run: node --version
      # 引数なしの CLI は使い方を表示して終了コード 2 を返す
      - run: code=0; node packages/cli/dist/cli.js || code=$?; test $code -eq 2
      # archive のあとも動くよう、検査用プロジェクトの change で動かす
      - run: node ../../../packages/cli/dist/cli.js verify --change sample --spec-only
        working-directory: tests/fixtures/verify-project
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash

  # PR ごとの完了ゲート（REQ-010, REQ-054, REQ-132）。PR 本文・変えたファイル・ブランチ名から決めた change を --done で検査する
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ci-gate が gh で PR 本文を読む
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # verify --done が実行する pnpm test の changeset status のため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # validate の結果が OpenSpec の更新で変わらないよう、版を固定する
      - run: npm install -g @fission-ai/openspec@1.14.3
      - run: pnpm build
      - run: node scripts/ci-gate.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
