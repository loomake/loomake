name: ci

# 使い捨て: Windows で監視役が結果を書かずに終わったときの taskkill の結果を調べる（マージしない）
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx vitest run packages/runner/test/external-budget.test.ts -t REQ-250 --silent=false
        continue-on-error: true
      - run: npx vitest run packages/runner/test/external-budget.test.ts -t REQ-250 --silent=false
        continue-on-error: true
      - run: npx vitest run packages/kit/test/process.test.ts -t REQ-250 --silent=false
        continue-on-error: true
