name: ci

on:
  # PR にラベルを付けたときにも起動する（REQ-273）。既定の種類（opened・synchronize・reopened）は残す
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # 毎日 1 回、main を 3 つの OS で確かめる（REQ-049）。18:00 UTC は日本時間の 3:00
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

# 同じ PR に新しい push があれば、古い実行を取り消す。main への push の実行は取り消さない（docs/dev/ci.md）
# main への push は実行ごとに group を分ける。group が同じだと、待機中の実行が次の push の実行に置き換えられて取り消される
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 品質コマンドを実行する。PR では ubuntu だけで、main への push・定期実行と、専用のラベルが付いた PR では 3 つの OS で実行する（REQ-049・REQ-273）。
  # macOS と Windows ではテストを 2 つのシャードに分ける（REQ-214）。文書だけの PR では飛ばす（REQ-270）
  # OS が ubuntu だけのときは、シャードの組み合わせがすべて exclude で除かれ、include の ubuntu だけが残る
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:all-os') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        shard: ['1/2', '2/2']
        exclude:
          - os: ubuntu-latest
        include:
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # changeset status は main からの差分を見るため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
        shell: bash
      # 文書だけの PR では、ここから下のステップを飛ばす（REQ-270）。必須チェックのジョブが同じ名前で結果を報告するよう、
      # paths フィルタではなくジョブの中で判定する。PR でないとき・判定できないときは docs_only=false になり、すべて実行する
      - id: changes
        run: node scripts/ci-docs-only.mjs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
      # 外部 Action の参照は、固定の検査（REQ-167）が読めるよう、ステップの先頭の「- uses:」に置く
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck
      # 2 つのシャードを合わせて、すべてのテストを実行する
      - if: matrix.shard && steps.changes.outputs.docs_only != 'true'
        run: pnpm test --shard=${{ matrix.shard }}
      # ubuntu ではすべてのテストを 1 回だけ、カバレッジ付きで実行する。カバレッジは閾値（vitest.config.ts）を下回ったら失敗する。1 つの OS で測れば足りる
      - if: ${{ !matrix.shard && steps.changes.outputs.docs_only != 'true' }}
        run: pnpm test --coverage
      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build
      - if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
        shell: bash
      - if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash

  # 過去の下限Node20での追加確認。配布物の宣言する下限は下のnode22で検証する。
  # 開発用ツールの動作環境に左右されないよう、インストールとビルドは開発と同じ Node 24 で行う
  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-offline"
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
      - run: node --version
      # 引数なしの CLI は使い方を表示して終了コード 2 を返す
      - run: code=0; node packages/cli/dist/cli.js || code=$?; test $code -eq 2
      # archive のあとも動くよう、検査用プロジェクトの change で動かす
      - run: node ../../../packages/cli/dist/cli.js verify --change sample --spec-only
        working-directory: tests/fixtures/verify-project
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: python3 scripts/deny-network.py node scripts/runtime-compatibility.mjs "$RUNNER_TEMP/loomake-offline" "$RUNNER_TEMP/loomake-runtime-results" 20.19.0
        shell: bash

  # 配布物で宣言する下限Node。Node20の追加試験とは分ける。
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: node scripts/package-smoke.mjs prepare "$RUNNER_TEMP/loomake-offline"
        shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - run: node --version
      # 引数なしの CLI は使い方を表示して終了コード 2 を返す
      - run: code=0; node packages/cli/dist/cli.js || code=$?; test $code -eq 2
      # archive のあとも動くよう、検査用プロジェクトの change で動かす
      - run: node ../../../packages/cli/dist/cli.js verify --change sample --spec-only
        working-directory: tests/fixtures/verify-project
      - run: node scripts/package-smoke.mjs check "$RUNNER_TEMP/loomake-package"
        shell: bash
      - run: python3 scripts/deny-network.py node scripts/runtime-compatibility.mjs "$RUNNER_TEMP/loomake-offline" "$RUNNER_TEMP/loomake-runtime-results" 22.12.0
        shell: bash

  # PR ごとの完了ゲート（REQ-010, REQ-054, REQ-132）。PR 本文・変えたファイル・ブランチ名から決めた change を --done で検査する
  # 文書だけの PR（REQ-270）でテストを実行するのは、このジョブの verify だけになる。テストを飛ばす変更の前に docs/dev/ci.md を読むこと
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ci-gate が gh で PR 本文を読む
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # verify --done が実行する pnpm test の changeset status のため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # validate の結果が OpenSpec の更新で変わらないよう、版を固定する
      - run: npm install -g @fission-ai/openspec@1.14.3
      # archive で反映したあとの仕様は、change ごとの完了ゲートでは検査されない（REQ-010）
      - run: openspec validate --specs --strict
      - run: pnpm build
      - run: node scripts/ci-gate.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
