name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 3 つの OS で品質コマンドを実行する（REQ-049）
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # changeset status は main からの差分を見るため、ローカルに main を用意する
      - run: git rev-parse --verify main || git branch main origin/main
        shell: bash
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # PR ごとの完了ゲート（REQ-010, REQ-054）。ブランチ名が change-id なら --done で検査する
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @fission-ai/openspec
      - run: node scripts/ci-gate.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
